<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#c9843a" />
    <title>Кондитер ловит десерты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script>
      (function () {
        var fine = window.matchMedia('(pointer: fine)').matches;
        var hover = window.matchMedia('(hover: hover)').matches;
        var noTouch = navigator.maxTouchPoints === 0;
        if (fine || hover || noTouch) document.documentElement.classList.add('is-desktop');
      })();
    </script>
  </head>
  <body>
    <div id="rotate-overlay" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon">↔</div>
        <p>Поверните телефон горизонтально</p>
      </div>
    </div>

    <div id="app">
      <header id="hud">
        <div class="hud-group score-box">
          <span class="hud-label">Счёт</span>
          <span id="score-value">0000</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">Уровень</span>
          <span id="level-value">1</span>
        </div>
        <div id="lives" class="hud-group lives" aria-label="Жизни: 3"></div>
        <button id="pause-btn" class="icon-btn hidden" type="button" aria-label="Пауза">⏸</button>
      </header>

      <main id="stage">
        <canvas id="game-canvas" width="960" height="540"></canvas>
      </main>

      <div id="mobile-controls">
        <div class="ctrl-hand left">
          <button type="button" class="ctrl-btn" data-pos="upper-left" aria-label="Верх слева">↖</button>
          <button type="button" class="ctrl-btn" data-pos="lower-left" aria-label="Низ слева">↙</button>
        </div>
        <div class="ctrl-hand right">
          <button type="button" class="ctrl-btn" data-pos="upper-right" aria-label="Верх справа">↗</button>
          <button type="button" class="ctrl-btn" data-pos="lower-right" aria-label="Низ справа">↘</button>
        </div>
      </div>

      <section id="start-screen" class="overlay">
        <div class="panel start-panel">
          <h1>Кондитер ловит десерты</h1>
          <div class="chef-preview" aria-hidden="true">
            <svg class="chef-svg" viewBox="0 0 220 280" xmlns="http://www.w3.org/2000/svg">
              <ellipse cx="110" cy="262" rx="48" ry="10" fill="rgba(90,40,16,0.18)"/>
              <path d="M86 196 l-6 42 c-1 8 6 12 14 10 l10-4 2-48z" fill="#3d3d4e"/>
              <path d="M132 196 l8 42 c2 8-5 13-14 11 l-11-4-2-49z" fill="#3d3d4e"/>
              <rect x="78" y="232" width="22" height="10" rx="4" fill="#d94f6d"/>
              <rect x="122" y="232" width="22" height="10" rx="4" fill="#d94f6d"/>
              <path d="M82 198 h14 v36 h-14z" fill="#f4ead2"/>
              <path d="M124 198 h14 v36 h-14z" fill="#f4ead2"/>
              <rect x="80" y="198" width="8" height="10" fill="#d94f6d"/>
              <rect x="88" y="208" width="8" height="10" fill="#fff"/>
              <rect x="80" y="218" width="8" height="10" fill="#d94f6d"/>
              <rect x="132" y="198" width="8" height="10" fill="#fff"/>
              <rect x="124" y="208" width="8" height="10" fill="#d94f6d"/>
              <rect x="132" y="218" width="8" height="10" fill="#fff"/>
              <rect x="72" y="118" width="76" height="86" rx="22" fill="#f7f4ee" stroke="#d9d0c2" stroke-width="2"/>
              <rect x="108" y="126" width="5" height="70" rx="2" fill="#e6ddd0"/>
              <circle cx="96" cy="148" r="5" fill="#d4c4a8"/>
              <circle cx="124" cy="148" r="5" fill="#d4c4a8"/>
              <circle cx="96" cy="172" r="5" fill="#d4c4a8"/>
              <circle cx="124" cy="172" r="5" fill="#d4c4a8"/>
              <path d="M74 128 c-16 18-18 40-8 58" fill="none" stroke="#f7f4ee" stroke-width="14" stroke-linecap="round"/>
              <path d="M146 130 c18 16 22 38 10 56" fill="none" stroke="#f7f4ee" stroke-width="14" stroke-linecap="round"/>
              <circle cx="64" cy="188" r="8" fill="#f3c7a3"/>
              <circle cx="158" cy="186" r="8" fill="#f3c7a3"/>
              <ellipse cx="110" cy="96" rx="32" ry="34" fill="#f3c7a3"/>
              <ellipse cx="88" cy="102" rx="8" ry="5" fill="#f0a090"/>
              <ellipse cx="132" cy="102" rx="8" ry="5" fill="#f0a090"/>
              <circle cx="99" cy="92" r="5" fill="#2c2c38"/>
              <circle cx="121" cy="92" r="5" fill="#2c2c38"/>
              <circle cx="101" cy="90" r="1.8" fill="#fff"/>
              <circle cx="123" cy="90" r="1.8" fill="#fff"/>
              <path d="M100 112 q10 10 20 0" fill="none" stroke="#c47a62" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M92 82 q8-6 16 0" fill="none" stroke="#2c2c38" stroke-width="2" stroke-linecap="round"/>
              <path d="M112 82 q8-6 16 0" fill="none" stroke="#2c2c38" stroke-width="2" stroke-linecap="round"/>
              <rect x="80" y="58" width="60" height="18" rx="8" fill="#fff" stroke="#d7d0c4" stroke-width="2"/>
              <ellipse cx="110" cy="42" rx="28" ry="24" fill="#fff" stroke="#d7d0c4" stroke-width="2"/>
              <ellipse cx="98" cy="34" rx="10" ry="8" fill="#fffaf3"/>
              <ellipse cx="122" cy="32" rx="9" ry="7" fill="#fffaf3"/>
              <g transform="translate(168 168)">
                <ellipse cx="0" cy="18" rx="28" ry="10" fill="rgba(255,220,120,0.25)"/>
                <ellipse cx="0" cy="10" rx="26" ry="12" fill="#c9843a"/>
                <ellipse cx="0" cy="8" rx="18" ry="7" fill="#8a4f1e"/>
                <path d="M-18 2 q18-22 36 0" fill="none" stroke="#dca056" stroke-width="4" stroke-linecap="round"/>
                <rect x="-10" y="-10" width="14" height="10" rx="2" fill="#f4c1d4"/>
                <path d="M-10 -10 h14 v4 h-14z" fill="#8fd3c2"/>
                <circle cx="10" cy="-6" r="6" fill="#e23b4a"/>
                <path d="M8 -14 l2 5 2-5 2 5" fill="#3fa35a"/>
                <circle cx="-2" cy="-2" r="4" fill="#f4a6c8"/>
              </g>
            </svg>
          </div>
          <button id="play-btn" class="primary-btn" type="button">Старт</button>
        </div>
      </section>

      <section id="pause-overlay" class="overlay hidden">
        <div class="panel compact">
          <h2>Пауза</h2>
          <button id="resume-btn" class="primary-btn" type="button">Продолжить</button>
        </div>
      </section>

      <section id="gameover-screen" class="overlay hidden">
        <div class="panel">
          <h2>Game Over</h2>
          <p class="final-label">Итоговый счёт</p>
          <p id="final-score">0000</p>
          <button id="retry-btn" class="primary-btn" type="button">Играть снова</button>
        </div>
      </section>
    </div>

    <script type="module" src="src/main.js"></script>
    <script>
      window.__pendingStart = false;
      document.getElementById('play-btn').addEventListener('click', function () {
        if (typeof window.startGame === 'function') window.startGame();
        else window.__pendingStart = true;
      });
      document.getElementById('retry-btn').addEventListener('click', function () {
        if (typeof window.startGame === 'function') window.startGame();
        else window.__pendingStart = true;
      });
    </script>
  </body>
</html>
