<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#c9843a" />
    <title>Кондитер ловит десерты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css?v=iphone2" />
    <script>
      (function () {
        function isPhone() {
          return navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) <= 920;
        }
        function isLandscape() {
          var w = (window.visualViewport && window.visualViewport.width) || window.innerWidth;
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          if (w > h) return true;
          if (window.matchMedia('(orientation: landscape)').matches) return true;
          if (typeof window.orientation === 'number' && Math.abs(window.orientation) === 90) return true;
          return false;
        }
        function sync() {
          var need = isPhone() && !isLandscape();
          document.documentElement.classList.toggle('need-rotate', need);
          document.documentElement.classList.toggle('is-desktop', !isPhone());
        }
        sync();
        window.addEventListener('orientationchange', function () {
          sync();
          setTimeout(sync, 100);
          setTimeout(sync, 400);
          setTimeout(sync, 800);
        });
        window.addEventListener('resize', sync);
        var mq = window.matchMedia('(orientation: landscape)');
        if (mq.addEventListener) mq.addEventListener('change', sync);
        else if (mq.addListener) mq.addListener(sync);
      })();
    </script>
  </head>
  <body>
    <div id="rotate-overlay" aria-live="polite">
      <div class="rotate-card">
        <div class="rotate-icon">↔</div>
        <p>Поверните телефон горизонтально</p>
        <button id="open-game-btn" class="primary-btn" type="button">Открыть игру</button>
      </div>
    </div>

    <div id="app">
      <header id="hud">
        <div class="hud-group score-box">
          <span class="hud-label">Счёт</span>
          <span id="score-value">0000</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">Уровень</span>
          <span id="level-value">1</span>
        </div>
        <div id="lives" class="hud-group lives" aria-label="Жизни: 3"></div>
        <button id="pause-btn" class="icon-btn hidden" type="button" aria-label="Пауза">⏸</button>
      </header>

      <main id="stage">
        <canvas id="game-canvas" width="960" height="540"></canvas>
      </main>

      <div id="mobile-controls">
        <div class="ctrl-hand left">
          <button type="button" class="ctrl-btn" data-pos="upper-left" aria-label="Верх слева">↖</button>
          <button type="button" class="ctrl-btn" data-pos="lower-left" aria-label="Низ слева">↙</button>
        </div>
        <div class="ctrl-hand right">
          <button type="button" class="ctrl-btn" data-pos="upper-right" aria-label="Верх справа">↗</button>
          <button type="button" class="ctrl-btn" data-pos="lower-right" aria-label="Низ справа">↘</button>
        </div>
      </div>

          </div>
          <button id="play-btn" class="primary-btn" type="button">Старт</button>
        </div>
      </section>

      <section id="pause-overlay" class="overlay hidden">
        <div class="panel compact">
          <h2>Пауза</h2>
          <button id="resume-btn" class="primary-btn" type="button">Продолжить</button>
        </div>
      </section>

      <section id="gameover-screen" class="overlay hidden">
        <div class="panel">
          <h2>Game Over</h2>
          <p class="final-label">Итоговый счёт</p>
          <p id="final-score">0000</p>
          <button id="retry-btn" class="primary-btn" type="button">Играть снова</button>
        </div>
      </section>
    </div>

    <script type="module" src="src/main.js?v=iphone2"></script>
    <script>
      window.__pendingStart = false;
      function tapStart(event) {
        if (event) event.preventDefault();
        if (tapStart._busy) return;
        tapStart._busy = true;
        setTimeout(function () { tapStart._busy = false; }, 400);
        if (typeof window.startGame === 'function') window.startGame();
        else window.__pendingStart = true;
      }
      function bindTap(id, handler) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('pointerup', handler);
        el.addEventListener('click', handler);
      }
      bindTap('play-btn', tapStart);
      bindTap('retry-btn', tapStart);
      bindTap('open-game-btn', function () {
        document.documentElement.classList.remove('need-rotate');
      });
    </script>
  </body>
</html>
