<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#c9843a" />
    <title>Кондитер ловит десерты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css?v=all5" />
    <script>
      (function () {
        var w = window.innerWidth || 320;
        var h = window.innerHeight || 480;
        if (window.visualViewport) {
          if (window.visualViewport.width) w = window.visualViewport.width;
          if (window.visualViewport.height) h = window.visualViewport.height;
        }
        var root = document.documentElement;
        root.style.setProperty('--app-width', Math.round(w) + 'px');
        root.style.setProperty('--app-height', Math.round(h) + 'px');
        var touch = navigator.maxTouchPoints > 0;
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        var shortSide = Math.min(screen.width, screen.height);
        var isTouch = touch && (coarse || shortSide <= 1180);
        root.classList.toggle('is-desktop', !isTouch);
        root.classList.toggle('is-touch', isTouch);
        root.classList.toggle('is-landscape', w > h);
      })();
    </script>
  </head>
  <body>
    <div id="app" data-state="start">
      <div id="hurt-flash" aria-hidden="true"></div>
      <header id="hud">
        <div class="hud-group score-box">
          <span class="hud-label">Счёт</span>
          <span id="score-value">0000</span>
        </div>
        <div class="hud-group">
          <span class="hud-label">Уровень</span>
          <span id="level-value">1</span>
        </div>
        <div id="lives" class="hud-group lives" aria-label="Жизни: 3"></div>
        <button id="pause-btn" class="icon-btn hidden" type="button" aria-label="Пауза">⏸</button>
      </header>

      <main id="stage">
        <canvas id="game-canvas" width="960" height="540"></canvas>
      </main>

      <div id="mobile-controls">
        <div class="ctrl-hand left">
          <button type="button" class="ctrl-btn" data-pos="upper-left" aria-label="Верх слева">↖</button>
          <button type="button" class="ctrl-btn" data-pos="lower-left" aria-label="Низ слева">↙</button>
        </div>
        <div class="ctrl-hand right">
          <button type="button" class="ctrl-btn" data-pos="upper-right" aria-label="Верх справа">↗</button>
          <button type="button" class="ctrl-btn" data-pos="lower-right" aria-label="Низ справа">↘</button>
        </div>
      </div>

          </div>
          <p class="rules">
            Ловите вкусные ингредиенты корзиной. Мыло, губку, болт, носок и батарейку
            ловить нельзя — за это теряется жизнь.
          </p>
          <div class="pc-help">
            <p class="help-title">Управление</p>
            <ul class="help-keys">
              <li>Левая рука: <b>W</b> верх, <b>S</b> низ</li>
              <li>Правая рука: <b>P</b> верх, <b>L</b> низ</li>
              <li>Пауза: <b>Esc</b></li>
            </ul>
          </div>
          <button id="play-btn" class="primary-btn" type="button">Старт</button>
        </div>
      </section>

      <section id="pause-overlay" class="overlay hidden">
        <div class="panel compact">
          <h2>Пауза</h2>
          <button id="resume-btn" class="primary-btn" type="button">Продолжить</button>
        </div>
      </section>

      <section id="gameover-screen" class="overlay hidden">
        <div class="panel">
          <h2>Game Over</h2>
          <p class="final-label">Итоговый счёт</p>
          <p id="final-score">0000</p>
          <button id="retry-btn" class="primary-btn" type="button">Играть снова</button>
        </div>
      </section>
    </div>

    <script type="module" src="src/main.js?v=all5"></script>
    <script nomodule>
      document.getElementById('play-btn').textContent = 'Нужен новый браузер';
    </script>
    <script>
      window.__pendingStart = false;
      function tapStart() {
        if (tapStart._busy) return;
        tapStart._busy = true;
        setTimeout(function () { tapStart._busy = false; }, 400);
        if (typeof window.startGame === 'function') window.startGame();
        else window.__pendingStart = true;
      }
      function bindTap(id) {
        var el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', tapStart);
        el.addEventListener('touchend', function (event) {
          if (event.cancelable) event.preventDefault();
          tapStart();
        });
      }
      bindTap('play-btn');
      bindTap('retry-btn');
    </script>
  </body>
</html>
